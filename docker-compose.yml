version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: client5_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: client5
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: client5_liljr
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./models/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U client5 -d client5_liljr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - client5_network

  redis:
    image: redis:7-alpine
    container_name: client5_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - client5_network

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: client5_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://client5:${DB_PASSWORD}@postgres:5432/client5_liljr
      - REDIS_URL=redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - client5_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: client5_frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - backend
    networks:
      - client5_network

  nginx:
    image: nginx:alpine
    container_name: client5_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - client5_network

volumes:
  postgres_data:
  redis_data:

networks:
  client5_network:
    driver: bridge
